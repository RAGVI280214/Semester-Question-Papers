<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Semester Question Papers
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header>

    <div class="logo">
        📚 Question Papers
    </div>


    <nav>

        <a href="#papers">
            Papers
        </a>

        <a href="/admin.html">
            Admin
        </a>

    </nav>

</header>



<section class="hero">

    <h1>
        Semester Question Papers
    </h1>

    <p>
        Find previous semester question papers
        quickly and easily.
    </p>

    <a
        href="#papers"
        class="hero-button"
    >
        Browse Papers
    </a>

</section>



<section class="search-section">

    <input
        type="text"
        id="search"
        placeholder="Search subject, branch or year..."
    >

</section>



<section
    id="papers"
    class="papers-section"
>

    <h2>
        Available Question Papers
    </h2>


    <div class="filters">


        <select id="semesterFilter">

            <option value="">
                All Semesters
            </option>

            <option value="1">
                1st Semester
            </option>

            <option value="2">
                2nd Semester
            </option>

            <option value="3">
                3rd Semester
            </option>

            <option value="4">
                4th Semester
            </option>

            <option value="5">
                5th Semester
            </option>

            <option value="6">
                6th Semester
            </option>

            <option value="7">
                7th Semester
            </option>

            <option value="8">
                8th Semester
            </option>

        </select>



        <select id="branchFilter">

            <option value="">
                All Branches
            </option>

            <option value="CSE">
                CSE
            </option>

            <option value="ECE">
                ECE
            </option>

            <option value="EE">
                Electrical
            </option>

            <option value="ME">
                Mechanical
            </option>

            <option value="CE">
                Civil
            </option>

        </select>



        <select id="yearFilter">

            <option value="">
                All Years
            </option>

            <option value="2026">
                2026
            </option>

            <option value="2025">
                2025
            </option>

            <option value="2024">
                2024
            </option>

            <option value="2023">
                2023
            </option>

            <option value="2022">
                2022
            </option>

        </select>

    </div>



    <div
        id="papersContainer"
        class="papers-container"
    >

    </div>

</section>



<footer>

    <p>
        © 2026 Semester Question Papers
    </p>

</footer>



<script src="script.js"></script>

</body>

</html>
